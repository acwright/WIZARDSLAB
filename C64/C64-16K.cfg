# =============================================================================
#   C64 — Wizards Lab cartridge, 16 KB
# =============================================================================
#   EXROM and GAME both pulled low map ROML at $8000-$9FFF and ROMH at
#   $A000-$BFFF, contiguously, so this is one 16384-byte image. The header at
#   $8000 is cold vector, warm vector, then the "CBM80" signature.
#
#       x64sc -cart16 WizardsLab.crt
#
#   Work RAM sits at $0800. Everything from there to $1FFF is free, the
#   character set is copied to $2000, and VIC bank 0 sees screen memory at
#   $0400 where it already is.
# =============================================================================

MEMORY {
  ZP:       start=$0040, size=$00C0, type=rw, define=yes;
  RAM:      start=$0800, size=$0800, type=rw, define=yes;
  ROM:      start=$8000, size=$4000, file="%O", fill=yes, fillval=$FF;
}

SEGMENTS {
  ZEROPAGE: load=ZP,  type=zp;
  BSS:      load=RAM, type=bss, define=yes, align=$100;
  CARTHDR:  load=ROM, type=ro,  start=$8000;
  CODE:     load=ROM, type=ro;
  RODATA:   load=ROM, type=ro;
  TILES:    load=ROM, type=ro;
}
