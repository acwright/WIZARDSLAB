# =============================================================================
#   VC83 — Wizards Lab executable, WIZLAB.PRG
# =============================================================================
#   A VC83 program is a file, not a cartridge: EXEC reads an 11-byte header,
#   then loads each segment record to the bus address it names. This one has a
#   single record, the whole image, loaded at $0800, the start of program RAM.
#
#     "VC83"            magic
#     .word Start       where EXEC jumps
#     .word $0800       segment record: offset,
#     .byte $00           bus segment ($00 = main RAM),
#     .word size          and the number of bytes that follow
#
#   The size is __MAIN_LAST__ - $0800, which the linker works out; the BSS
#   that follows the image in RAM is not in the file, and needs no clearing
#   because the game clears what it uses.
#
#   Program RAM ends at $9FFF, where bank window A begins. Zero page $80-$FF
#   is the program's; the OS keeps $20-$7F and the hardware $00-$1F.
# =============================================================================

MEMORY {
  ZP:       start=$0080, size=$0080, type=rw, define=yes;
  HEADER:   start=$07F5, size=$000B, file="%O";
  MAIN:     start=$0800, size=$9800, file="%O", define=yes;
  RAM:      start=(__MAIN_LAST__+255)/256*256, size=$A000-(__MAIN_LAST__+255)/256*256,
            type=rw, define=yes;
}

SEGMENTS {
  ZEROPAGE: load=ZP,      type=zp;
  HEADER:   load=HEADER,  type=ro;
  CODE:     load=MAIN,    type=ro;
  RODATA:   load=MAIN,    type=ro;
  TILES:    load=MAIN,    type=ro;
  BSS:      load=RAM,     type=bss,  define=yes, align=$100;
}
