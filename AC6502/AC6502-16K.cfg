# =============================================================================
#   AC6502 — Wizards Lab cartridge, 16 KB
# =============================================================================
#   A cartridge overlays $C000-$FFFF, replacing BASIC, Wozmon and the CPU
#   vectors (and on BIOS 1.x the Monitor). The Kernal and its jump table stay
#   underneath: $A000-$B7FF with the 1.x character set above it at $B800, or
#   all of $A000-$BFFF on 2.x, which has no character set in ROM. This
#   cartridge reads neither set: its tiles are its own.
#
#   16 K is the code budget: $C000-$FFF9. The FILE is 32 K, spanning
#   $8000-$FFFF so it burns straight to a 28C256 or 27C256; the low half is
#   padding the machine never reads as cartridge ROM.
#
#   Work RAM is at $0800, the start of the 30 K program RAM region.
# =============================================================================

MEMORY {
  ZP:       start=$0040, size=$00C0, type=rw, define=yes;
  RAM:      start=$0800, size=$0800, type=rw, define=yes;
  PAD:      start=$8000, size=$4000, file="%O", fill=yes, fillval=$00;
  CART:     start=$C000, size=$3FFA, file="%O", fill=yes, fillval=$00;
  VECTORS:  start=$FFFA, size=$0006, file="%O", fill=yes, fillval=$00;
}

SEGMENTS {
  ZEROPAGE: load=ZP,      type=zp;
  BSS:      load=RAM,     type=bss,  define=yes, align=$100;
  CODE:     load=CART,    type=ro;
  RODATA:   load=CART,    type=ro;
  TILES:    load=CART,    type=ro;
  VECTORS:  load=VECTORS, type=ro;
}
