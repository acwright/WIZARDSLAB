# =============================================================================
#   VIC-20 — Wizards Lab cartridge, 16 KB
# =============================================================================
#   Two 8 K blocks: BLK5 ($A000-$BFFF) carries the autostart header and the
#   code, BLK3 ($6000-$7FFF) carries the data. BLK3 rather than BLK1 keeps the
#   KERNAL's RAM probe from doing anything surprising with the screen base.
#
#   Two blocks means two files. VICE wants them separately:
#       xvic -cartA WizardsLab-blk5.crt -cart6 WizardsLab-blk3.crt
#
#   RAM on an unexpanded machine is 5 K, and this is all of what is usable:
#       $1000-$13FF   1 K   work RAM (BSS) — the game needs about 530 bytes
#       $1400-$1BFF   2 K   character set, copied out of BLK3 at boot
#       $1C00-$1DFF   512   spare
#       $1E00-$1FF9   506   screen matrix (colour RAM is at $9600)
#
#   Designing the RAM layout against this machine first is what keeps the game
#   fitting all three.
# =============================================================================

MEMORY {
  ZP:       start=$0040, size=$00C0, type=rw, define=yes;
  RAM:      start=$1000, size=$0400, type=rw, define=yes;
  BLK3:     start=$6000, size=$2000, file="%O-blk3.crt", fill=yes, fillval=$FF;
  BLK5:     start=$A000, size=$2000, file="%O-blk5.crt", fill=yes, fillval=$FF;
}

SEGMENTS {
  ZEROPAGE: load=ZP,   type=zp;
  BSS:      load=RAM,  type=bss, define=yes, align=$100;
  CARTHDR:  load=BLK5, type=ro,  start=$A000;
  CODE:     load=BLK5, type=ro;
  RODATA:   load=BLK5, type=ro;
  TILES:    load=BLK3, type=ro,  start=$6000;
}
